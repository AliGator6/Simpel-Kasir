name: Build SimpelKasir APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          sudo chmod -R a+rwX "$SDK_DIR" || true
          yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Install dependencies & build web
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Add Capacitor Android & Bluetooth Thermal Bridge
        run: |
          npm install --no-save --legacy-peer-deps @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0
          npx cap add android
          mkdir -p android/app/src/main/java/com/tokocahaya/simpelkasir
          cp android-bridge/BluetoothPrinterPlugin.java android/app/src/main/java/com/tokocahaya/simpelkasir/
          cp android-bridge/MainActivity.java android/app/src/main/java/com/tokocahaya/simpelkasir/
          node -e '
            const fs = require("fs");
            const p = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(p, "utf8");
            const perms = [
              "<uses-permission android:name=\"android.permission.BLUETOOTH\" android:maxSdkVersion=\"30\" />",
              "<uses-permission android:name=\"android.permission.BLUETOOTH_ADMIN\" android:maxSdkVersion=\"30\" />",
              "<uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" android:maxSdkVersion=\"30\" />",
              "<uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" android:maxSdkVersion=\"30\" />",
              "<uses-permission android:name=\"android.permission.BLUETOOTH_SCAN\" android:usesPermissionFlags=\"neverForLocation\" />",
              "<uses-permission android:name=\"android.permission.BLUETOOTH_CONNECT\" />",
              "<uses-feature android:name=\"android.hardware.bluetooth\" android:required=\"false\" />"
            ].join("\n    ");
            if (!xml.includes("neverForLocation")) {
              xml = xml.replace("<application", perms + "\n    <application");
              fs.writeFileSync(p, xml);
            }
          '
          npx cap sync android

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-simpelkasir-${{ runner.os }}-v1

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          for attempt in 1 2 3; do
            echo "Build attempt $attempt/3..."
            ./gradlew assembleDebug --max-workers=2 --no-daemon && exit 0
            echo "Attempt $attempt failed (kemungkinan rate limit 429), menunggu 20 detik..."
            sleep 20
          done
          exit 1

      - name: Build Signed Release APK (if Keystore Secret exists)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release-key.jks
            cd android
            for attempt in 1 2 3; do
              ./gradlew assembleRelease --max-workers=2 --no-daemon \
                -Pandroid.injected.signing.store.file=release-key.jks \
                -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
                -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
                -Pandroid.injected.signing.key.password="$KEY_PASSWORD" && exit 0
              sleep 20
            done
            exit 1
          else
            echo "No KEYSTORE_BASE64 secret configured; skipping release signing."
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpelKasir-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK Artifact (if built)
        if: hashFiles('android/app/build/outputs/apk/release/app-release.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: SimpelKasir-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
