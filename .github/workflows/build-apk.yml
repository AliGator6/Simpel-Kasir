name: Build SimpelKasir APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install & Build Web
        run: |
          npm install
          npm run build
      - name: Add Capacitor Android & Bluetooth Bridge
        run: |
          npm install --no-save @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0
          npx cap add android
          mkdir -p android/app/src/main/java/com/tokocahaya/simpelkasir
          cp android-bridge/BluetoothPrinterPlugin.java android/app/src/main/java/com/tokocahaya/simpelkasir/
          cp android-bridge/MainActivity.java android/app/src/main/java/com/tokocahaya/simpelkasir/
          node -e '
            const fs = require("fs");
            const p = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(p, "utf8");
            const perms = [
              "<uses-permission android:name=\"android.permission.BLUETOOTH\" android:maxSdkVersion=\"30\" />",
              "<uses-permission android:name=\"android.permission.BLUETOOTH_ADMIN\" android:maxSdkVersion=\"30\" />",
              "<uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" android:maxSdkVersion=\"30\" />",
              "<uses-permission android:name=\"android.permission.BLUETOOTH_SCAN\" />",
              "<uses-permission android:name=\"android.permission.BLUETOOTH_CONNECT\" />"
            ].join("\n    ");
            if (!xml.includes("BLUETOOTH_CONNECT")) {
              xml = xml.replace("<application", perms + "\n    <application");
              fs.writeFileSync(p, xml);
            }
          '
          npx cap sync android
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Build Signed Release APK (if secret exists)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release-key.jks
            cd android
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=release-key.jks \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: SimpelKasir-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - if: hashFiles('android/app/build/outputs/apk/release/app-release.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: SimpelKasir-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
